<style>
:root{--lift:0 60px 120px -60px rgba(10,19,16,.55)}

/* Hero */
@media (min-width:641px){.hero__title{font-size:clamp(3rem,9.2vw,8.6rem);max-width:13ch}}
.hero__veil{background:
  linear-gradient(to top,rgba(10,19,16,.96) 0%,rgba(10,19,16,.55) 32%,rgba(10,19,16,.06) 62%,rgba(10,19,16,.55) 100%),
  radial-gradient(70% 55% at 15% 95%,rgba(192,168,122,.16),transparent 70%)}
.hero__eyebrow{display:inline-flex;align-items:center;gap:1rem}
.hero__eyebrow::before{content:"";width:56px;height:1px;background:var(--gold)}
.hero__inner{will-change:transform,opacity}

/* Glass quick-enquiry bar */
.quick{display:grid;grid-template-columns:1.1fr 1fr auto;max-width:780px;
  background:rgba(250,247,240,.08);border:1px solid rgba(250,247,240,.22);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease) .95s,transform 1s var(--ease) .95s}
body.is-ready .quick{opacity:1;transform:none}
.quick label{display:grid;gap:.3rem;padding:.85rem 1.3rem;border-right:1px solid rgba(250,247,240,.16);
  font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-2)}
.quick input,.quick select{background:transparent;border:0;outline:0;color:var(--paper);color-scheme:dark;
  font:300 .95rem var(--sans);letter-spacing:0;text-transform:none;min-height:30px;width:100%}
.quick select option{color:#12302a}
.quick button{background:var(--gold);color:var(--ink);padding:0 2.2rem;min-height:56px;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;transition:background .4s var(--ease)}
.quick button:hover{background:var(--gold-2)}
@media (max-width:760px){.quick{grid-template-columns:1fr 1fr}.quick button{grid-column:1/-1}}
@media (max-width:420px){.quick{grid-template-columns:1fr}.quick label{border-right:0;border-bottom:1px solid rgba(250,247,240,.16)}}

/* Marquee, stats */
.marquee{padding-block:1.7rem}
.marquee span{font-size:clamp(1.4rem,2.4vw,2.1rem);opacity:.85}
.stats{border-top-color:rgba(192,168,122,.55)}

/* Experiences */
.exp__media{position:relative}
.exp__media::after{content:"";position:absolute;inset:1rem;border:1px solid rgba(250,247,240,.38);pointer-events:none;z-index:2}
.exp__media::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to top,rgba(10,19,16,.35),transparent 45%)}
.exp__body{box-shadow:var(--lift)}

/* Stay cards */
.card{overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:var(--gold);z-index:2;transition:width .8s var(--ease)}
.card:hover::before{width:100%}
.card__media{position:relative}
.card__media::after{content:"";position:absolute;inset:.8rem;border:1px solid rgba(250,247,240,.35);pointer-events:none}

/* Band, weddings */
.band::after{background:linear-gradient(to top,rgba(10,19,16,.9),rgba(10,19,16,.45)),
  radial-gradient(80% 80% at 50% 50%,transparent 40%,rgba(10,19,16,.5))}
.band__quote{font-size:clamp(1.8rem,4.4vw,3.7rem)}
.weddings{background:
  radial-gradient(60% 80% at 88% 15%,rgba(192,168,122,.13),transparent 60%),
  radial-gradient(50% 60% at 0% 100%,rgba(124,144,112,.18),transparent 60%),var(--forest)}
.weddings__media{box-shadow:0 60px 120px -50px rgba(0,0,0,.7)}

/* Events, gallery */
.event__name{transition:transform .55s var(--ease)}
.event:hover .event__name{transform:translateX(.7rem)}
.gallery__item::before{content:"";position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .5s var(--ease);
  background:linear-gradient(to top,rgba(10,19,16,.55),transparent 50%)}
.gallery__item:hover::before{opacity:1}
.gallery__item::after{z-index:2}

/* Facilities */
.facilities{background:radial-gradient(70% 60% at 100% 0%,rgba(192,168,122,.1),transparent 60%),var(--forest)}
.fac i{display:grid;place-items:center;width:46px;height:46px;border:1px solid rgba(192,168,122,.4);border-radius:50%;
  font-size:.9rem;transition:background .5s var(--ease),color .5s var(--ease),transform .5s var(--ease)}
.fac:hover i{background:var(--gold);color:var(--ink);transform:translateY(-4px)}

/* Enquiry form card */
.form{background:var(--bone);border:1px solid var(--line);box-shadow:var(--lift);padding:clamp(1.5rem,3.2vw,2.8rem)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}

/* Footer wordmark */
.footer__mark{font-family:var(--display);font-weight:300;font-size:clamp(4rem,23vw,23rem);line-height:.8;
  letter-spacing:-.05em;text-align:center;text-transform:uppercase;user-select:none;overflow:hidden;
  padding-bottom:.06em;margin-bottom:clamp(2rem,4vw,3rem);
  background:linear-gradient(to bottom,rgba(227,214,186,.3),rgba(227,214,186,0) 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* Lightbox navigation */
.lightbox__nav{position:absolute;top:50%;translate:0 -50%;width:52px;height:52px;border:1px solid rgba(250,247,240,.35);
  border-radius:50%;color:var(--paper);font-size:.9rem;display:grid;place-items:center;
  transition:background .4s var(--ease),color .4s var(--ease)}
.lightbox__nav:hover{background:var(--paper);color:var(--ink)}
.lightbox__nav--prev{left:clamp(.6rem,3vw,2rem)}
.lightbox__nav--next{right:clamp(.6rem,3vw,2rem)}
.lightbox__count{position:absolute;bottom:1.4rem;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:.64rem;letter-spacing:.28em;color:rgba(250,247,240,.55)}
@media (max-width:640px){.lightbox__nav{top:auto;bottom:1rem;translate:none;width:44px;height:44px}}
</style>

<script>
(function () {
  'use strict';
  var $ = function (s, c) { return (c || document).querySelector(s); };
  var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };
  var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  function make(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

  /* Quick-enquiry bar in the hero */
  var bar = $('.hero__bar');
  if (bar && !$('#quick')) {
    bar.parentNode.insertBefore(make(
      '<form class="quick" id="quick" aria-label="Quick enquiry">' +
      '<label>Date<input type="date" id="qDate" aria-label="Preferred date"></label>' +
      '<label>Occasion<select id="qType" aria-label="Occasion">' +
      '<option>Wedding</option><option>Corporate retreat</option><option>Glamping / cabin stay</option>' +
      '<option>Family gathering</option><option>Classic car event</option><option>Other</option></select></label>' +
      '<button type="submit">Check availability</button></form>'), bar);
  }

  /* Footer wordmark */
  var fb = $('.footer__bottom');
  if (fb && !$('.footer__mark')) {
    fb.parentNode.insertBefore(make('<div class="footer__mark" aria-hidden="true">Marura</div>'), fb);
  }

  /* Lightbox arrows + counter */
  var box = $('#lightbox'), img = $('#lightboxImg');
  if (box && img && !$('#lbPrev')) {
    box.insertBefore(make('<button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous image"><i class="fas fa-arrow-left"></i></button>'), img);
    box.appendChild(make('<button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next image"><i class="fas fa-arrow-right"></i></button>'));
    box.appendChild(make('<div class="lightbox__count" id="lbCount"></div>'));
  }

  /* Hero drifts and fades on scroll */
  var hero = $('.hero'), inner = $('.hero__inner'), media = $('.hero__media');
  if (hero && inner && media && !calm) {
    var busy = false;
    addEventListener('scroll', function () {
      if (busy) return; busy = true;
      requestAnimationFrame(function () {
        var y = scrollY, h = hero.offsetHeight;
        if (y < h) {
          inner.style.transform = 'translate3d(0,' + (y * 0.14).toFixed(1) + 'px,0)';
          inner.style.opacity = Math.max(0, 1 - y / (h * 0.85)).toFixed(2);
          media.style.transform = 'translate3d(0,' + (y * 0.22).toFixed(1) + 'px,0)';
        }
        busy = false;
      });
    }, { passive: true });
  }

  /* Quick bar fills the enquiry form and jumps to it */
  var q = $('#quick');
  if (q) q.addEventListener('submit', function (e) {
    e.preventDefault();
    var d = $('#date'), t = $('#type'), n = $('#name');
    if (d && $('#qDate').value) d.value = $('#qDate').value;
    if (t) t.value = $('#qType').value;
    var c = $('#contact');
    if (c) c.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    if (n) setTimeout(function () { n.focus({ preventScroll: true }); }, 900);
  });

  /* Stat counters */
  if ('IntersectionObserver' in window && !calm) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        io.unobserve(en.target);
        var node = en.target.firstChild, end = parseInt(node.nodeValue, 10), start = null;
        if (isNaN(end)) return;
        (function step(ts) {
          start = start || ts;
          var p = Math.min(1, (ts - start) / 1400), e = 1 - Math.pow(1 - p, 4);
          node.nodeValue = Math.round(end * e);
          if (p < 1) requestAnimationFrame(step);
        })(performance.now());
      });
    }, { threshold: 0.6 });
    $$('.stat b').forEach(function (b) { io.observe(b); });
  }

  /* Magnetic buttons */
  if (fine && !calm) {
    $$('.btn,.nav__cta').forEach(function (b) {
      b.addEventListener('mousemove', function (e) {
        var r = b.getBoundingClientRect();
        b.style.translate = ((e.clientX - r.left - r.width / 2) * 0.12).toFixed(1) + 'px ' +
                            ((e.clientY - r.top - r.height / 2) * 0.22).toFixed(1) + 'px';
      });
      b.addEventListener('mouseleave', function () { b.style.translate = ''; });
    });
  }

  /* Lightbox: previous / next / counter / arrow keys */
  var imgs = $$('.gallery__item img'), cnt = $('#lbCount'), cur = 0;
  function show(i) {
    if (!imgs.length) return;
    cur = (i + imgs.length) % imgs.length;
    img.src = imgs[cur].src; img.alt = imgs[cur].alt;
    cnt.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(imgs.length).padStart(2, '0');
  }
  imgs.forEach(function (el, i) { el.parentNode.addEventListener('click', function () { show(i); }); });
  var prev = $('#lbPrev'), next = $('#lbNext');
  if (prev) prev.addEventListener('click', function (e) { e.stopPropagation(); show(cur - 1); });
  if (next) next.addEventListener('click', function (e) { e.stopPropagation(); show(cur + 1); });
  addEventListener('keydown', function (e) {
    if (!box || !box.classList.contains('is-open')) return;
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
})();
</script>
